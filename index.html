
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employee records easily</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Add Employee</h2>

            <form id="employeeForm">
                <input type="hidden" id="editId">

                <input type="text" id="name" placeholder="Employee Name" required>
                <input type="text" id="designation" placeholder="Designation" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>

                <button type="submit" id="submitBtn">Add Employee</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Employee Records</h2>

            <input type="text" id="searchInput"
                placeholder="Search by name or designation...">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Designation</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeeList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
